name: Mise à jour des vidéos

on:
  push:
    branches: [main]
  schedule:
    # Un cron isolé peut être retardé ou supprimé par GitHub. Ces quatre seeds
    # relancent la veille si la chaîne auto-réarmée s'est arrêtée.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: "Durée de la fenêtre de surveillance"
        required: false
        default: "330"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: update-videos
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      WATCH_MINUTES: ${{ inputs.watch_minutes || '330' }}
      POLL_SECONDS: "300"
      SETUP_EVERY: "12"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Surveiller le flux et publier chaque changement
        run: bash scripts/watch_videos.sh

      - name: Réarmer la prochaine fenêtre de surveillance
        if: always()
        run: |
          # workflow_dispatch est l'exception documentée qui peut être déclenchée
          # par GITHUB_TOKEN. Le seed planifié reste le filet de sécurité si cette
          # étape ou le runner disparaît.
          gh workflow run update-videos.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f watch_minutes="$WATCH_MINUTES"
