name: Mise à jour des vidéos

on:
  schedule:
    # GitHub ne tient PAS la promesse d'un cron horaire : les passages observés
    # sont espacés de 2 à 3 h, avec des trous de 24 h. On demande donc quatre
    # créneaux par heure — il en passe assez pour tenir le rythme réel — et on
    # insiste autour de 10 h UTC, l'heure de publication des replays.
    - cron: "8,23,38,53 * * * *"
    - cron: "2,12,17,27,32,42,47,57 10-12 * * *"
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire le flux RSS et mettre à jour videos.json
        run: python scripts/update_videos.py

      - name: Regénérer les pages de référencement
        run: python scripts/gen_seo.py

      # setup.json est écrit à la main : le job ne fait que le résoudre contre
      # Data Dragon, pour qu'une modification à la main soit en ligne dans l'heure
      # sans rien lancer côté PC.
      - name: Résoudre les runes et les builds
        run: python scripts/gen_setup.py

      - name: Committer si changement
        run: |
          git add data/videos.json data/setup-built.json matchups sitemap.xml
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "MAJ automatique des vidéos"
            # Un commit humain a pu arriver entre le checkout et le push :
            # on se resynchronise et on réessaie au lieu d'échouer.
            for i in 1 2 3; do
              if git push; then
                exit 0
              fi
              git pull --rebase origin main || { git rebase --abort; exit 1; }
            done
            git push
          fi
