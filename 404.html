<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Page introuvable — Gyn Replays</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2v28M4 9l24 14M4 23L28 9' stroke='%236fd3ff' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;--bg:#0a0e14;--line:#1d2735;--text:#e9f0f7;--muted:#a9b7c8;--accent:#6fd3ff}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:var(--bg)}
    body{display:grid;place-items:center;color:var(--text);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
    main{max-width:560px}h1{font:700 36px/1.15 "Segoe UI",system-ui,sans-serif;margin:0 0 12px}p{color:var(--muted);margin:0 0 24px}
    a{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--accent);border-radius:6px;padding:8px 14px;color:var(--accent);text-decoration:none}
    a:hover{background:rgba(111,211,255,.12);color:#a5e3ff}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    @media(max-width:600px){h1{font-size:30px}}
  </style>
</head>
<body>
  <main>
    <h1>Cette page n’existe pas</h1>
    <p>Le matchup a peut-être changé d’adresse. Retourne au catalogue pour choisir un rôle et un champion.</p>
    <a href="https://gynlol.github.io/">Retour aux matchups</a>
  </main>
</body>
</html>
